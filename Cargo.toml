[package]
name = "transitfoamer"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
protobuf = "3.7.2"
reqwest = "0.12.5"
gtfs-realtime = "0.1.3"
prost = "0.13.3"
tokio = { version = "1.43.1", features = ["macros", "rt-multi-thread", "signal"] }
csv = "1.3.1"
serde = "1.0.219"
chrono = "0.4.41"
serde_json = "1.0.140"
axum = "0.8.7"
tower-http = { version = "0.6.8", features = ["full"] }
http = "1.4.0"
axum-server = "0.8.0"

[dev-dependencies]
ring = "0.17.13"
openssl = "0.10.72"

